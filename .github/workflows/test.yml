name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://test:password@127.0.0.1:5432/grape_on_rails_test
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.entry.gemfile }}.gemfile
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: grape_on_rails_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d grape_on_rails_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.3', gemfile: rails_6_1 }
          - { ruby: '3.3', gemfile: rails_7 }
          - { ruby: '3.4', gemfile: rails_8_0 }
          - { ruby: '3.4', gemfile: rails_8 }
          - { ruby: '4.0', gemfile: rails_8 }
    name: Ruby ${{ matrix.entry.ruby }} / ${{ matrix.entry.gemfile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
      - name: Configure database
        run: cp config/database.gha.yml config/database.yml
      - name: Run tests
        run: |
          bundle exec rake db:create
          xvfb-run -a bundle exec rake spec
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          flag-name: ruby-${{ matrix.entry.ruby }}-${{ matrix.entry.gemfile }}
          parallel: true
  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
